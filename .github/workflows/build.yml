name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  colcon-build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-opencv \
            python3-pip \
            python3-rosdep \
            ros-humble-cv-bridge \
            ros-humble-nav2-msgs
          rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "fastcdr rti-connext-dds-6.0.1 urdfdom_headers librealsense2 ros-humble-realsense2-camera ros-humble-realsense2-camera-msgs jetson-stats" \
            || true
          pip install -q "aiohttp>=3.9" "aiortc>=1.6" "av>=11" "psutil>=5.9" "requests>=2.31" "PyYAML"

      - name: Build workspace
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+
        shell: bash

      - name: Run tests
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ \
            --ctest-args -LE "linter"   # linters run in lint.yml
          colcon test-result --verbose
        shell: bash
