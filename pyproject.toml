[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "install",
    "log",
    "**/test/test_copyright.py",
    "**/test/test_pep257.py",
    "**/test/test_flake8.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",   # long lines — caught by line-length
    "E731",   # lambda assignment (sometimes useful in launch files)
    "B008",   # function call in default arg (FastAPI/aiohttp idioms)
]

[tool.ruff.lint.per-file-ignores]
"**/launch/*.launch.py" = ["E402"]   # sys.path manipulation before imports
"**/setup.py" = ["E501"]
